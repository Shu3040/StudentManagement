<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>受講生登録</title>
</head>
<body>
<h1>受講生登録</h1>
<!--<form th:action="@{/registerStudent}" th:object="${studentDetail}" method="post"> -->
<form id="studentForm">
    <div>
        <label for="name">名前:</label>
        <!-- <input type="text" id="name" th:field="*{student.name}" required/> -->
        <input type="text" id="name" required/>
    </div>
    <div>
        <label for="furigana">フリガナ:</label>
        <input type="text" id="furigana" required/>
    </div>
    <div>
        <label for="nickname">ニックネーム:</label>
        <input type="text" id="nickname" required/>
    </div>
    <div>
        <label for="mailaddress">メールアドレス:</label>
        <input type="text" id="mailaddress" required/>
    </div>
    <div>
        <label for="address">住所:</label>
        <input type="text" id="address" required/>
    </div>
    <div>
        <label for="tel">電話番号:</label>
        <input type="text" id="tel" required/>
    </div>
    <div>
        <label for="age">年齢:</label>
        <input type="text" id="age"/>
    </div>
    <div>
        <label for="gender">性別:</label>
        <input type="text" id="gender"/>
    </div>
    <div>
        <label for="remark">備考:</label>
        <input type="text" id="remark"/>
    </div>
    <div>
    <!-- <div th:each="course, stat : *{studentCourse}"> -->
        <label for="courseName"> 受講コース名: </label>
       <!-- <input type="text" id="courseName" th:id="studentCourse.__${stat.index}__.courseName" th:field="*{studentCourse[__${stat.index}__].courseName}" /> -->
        <input type="text" id="courseName"/>
    </div>
    <div>
        <button type="submit">登録</button>
    </div>

</form>
<script>
    document.getElementById("studentForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const data = {
            student: {
                name: document.getElementById("name").value,
                furigana: document.getElementById("furigana").value,
                nickname: document.getElementById("nickname").value,
                mailaddress: document.getElementById("mailaddress").value,
                address: document.getElementById("address").value,
                tel: document.getElementById("tel").value,
                age: document.getElementById("age").value,
                gender: document.getElementById("gender").value,
                remark: document.getElementById("remark").value
            },
            studentCourseList: [
                {
                    courseName: document.getElementById("courseName").value
                }
            ]
        };

        fetch("/registerStudent", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
        .then(res => {
            if (res.ok) {
                alert("登録成功");
            } else {
                alert("登録失敗");
            }
        })
        .catch(() => alert("通信エラー"));
    });
</script>
</body>
</html>
