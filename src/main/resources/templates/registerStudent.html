<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>受講生登録</title>
</head>
<body>
<h1>受講生登録</h1>
<form th:action="@{/registerStudent}" th:object="${studentDetail}" method="post">
    <div>
        <label for="name">名前:</label>
        <input type="text" id="name" th:field="*{student.name}" required/>
    </div>
    <div>
        <label for="furigana">フリガナ:</label>
        <input type="text" id="furigana" th:field="*{student.furigana}" required/>
    </div>
    <div>
        <label for="nickname">ニックネーム:</label>
        <input type="text" id="nickname" th:field="*{student.nickname}" required/>
    </div>
    <div>
        <label for="mailaddress">メールアドレス:</label>
        <input type="text" id="mailaddress" th:field="*{student.mailaddress}" required/>
    </div>
    <div>
        <label for="address">住所:</label>
        <input type="text" id="address" th:field="*{student.address}" required/>
    </div>
    <div>
        <label for="tel">電話番号:</label>
        <input type="text" id="tel" th:field="*{student.tel}" required/>
    </div>
    <div>
        <label for="age">年齢:</label>
        <input type="text" id="age" th:field="*{student.age}" />
    </div>
    <div>
        <label for="gender">性別:</label>
        <input type="text" id="gender" th:field="*{student.gender}" />
    </div>
    <div>
        <label for="remark">性別:</label>
        <input type="text" id="remark" th:field="*{student.remark}" />
    </div>
    <div>
        <button type="submit">登録</button>
    </div>

</form>
</body>
</html>
